name: Nightly quality

on:
  schedule:
    - cron: "30 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:web:all
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-browser-results
          path: |
            allure-results
            test-results
          retention-days: 7

  api-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/api
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-api-results
          path: allure-results
          retention-days: 7
