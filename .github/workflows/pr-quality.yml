name: PR quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:web && npm run test:admin
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-and-allure-results
          path: |
            allure-results
            test-results
          retention-days: 7

  api-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check tests python_support
      - run: python -m pytest tests/api -m smoke
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-allure-results
          path: allure-results
          retention-days: 7
