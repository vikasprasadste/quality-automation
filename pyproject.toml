[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edvantaze-quality-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "allure-pytest>=2.13,<3",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.9,<3",
  "pytest>=8.3,<9",
  "pytest-xdist>=3.6,<4",
  "pyyaml>=6.0,<7"
]

[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["python_support"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --alluredir=allure-results"
testpaths = ["tests/api", "tests/ai_evals"]
markers = [
  "smoke: release-blocking smoke coverage",
  "integration: tests requiring deployed staging dependencies",
  "security: authorization, privacy, and security coverage",
  "ai_eval: future AI evaluation coverage"
]

[tool.ruff]
line-length = 100
target-version = "py311"
